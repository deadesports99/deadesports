name: Android

# Har push/PR pe dono apps ka debug APK build hota hai.
# White-label: google-services.json commit nahi hota, isliye Firebase push
# CI me off rehta hai — app phir bhi build hota hai (build.gradle.kts check).
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40

    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4
        with:
          cache-read-only: false

      - name: Gradle wrapper permissions
        run: chmod +x gradlew

      - name: Build player + admin
        run: ./gradlew :app-player:assembleDebug :app-admin:assembleDebug --no-daemon --console=plain --stacktrace

      - name: Lint (non-blocking)
        # Lint fails build na kare — pehle ek baseline bane, phir blocking karenge.
        continue-on-error: true
        run: ./gradlew :app-player:lintDebug :app-admin:lintDebug --no-daemon --console=plain

      - name: Upload APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-apks-${{ github.run_number }}
          path: |
            android/app-player/build/outputs/apk/debug/*.apk
            android/app-admin/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-reports-${{ github.run_number }}
          path: |
            android/app-player/build/reports/lint-results-debug.html
            android/app-admin/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7
