# Keeps the Render free web service awake.
#
# Render spins a Free web service down after 15 minutes without inbound
# traffic, and the next visitor waits ~1 minute for it to boot. Pinging
# /health every 10 minutes keeps it warm.
#
# /health is deliberately cheap: it reports process uptime and memory and
# touches neither Postgres nor Redis, so this ping never wakes Neon and never
# burns its 100 CU-hours/month free compute.
#
# GitHub runs scheduled workflows on a best-effort basis (a busy queue can add
# a few minutes of delay), which is still well inside Render's 15-minute window.
name: keepalive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 https://spartan-arena.onrender.com/health || true)
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "service did not answer /health with 200" >&2
          exit 1
