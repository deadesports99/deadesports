# Render Blueprint for the production API. Set DATABASE_URL and REDIS_URL in
# the Render dashboard; secrets are intentionally not stored in this repository.
services:
  - type: web
    name: free-fire-tournament-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: DB_POOL_MAX
        value: "10"
      - key: DB_POOL_IDLE_TIMEOUT_MS
        value: "10000"
      - key: DB_POOL_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: FCM_CREDENTIALS_JSON
        sync: false
