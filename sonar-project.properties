# 🔍 SonarQube / SonarCloud Project Configuration
sonar.projectKey=free-fire-tourney-platform
sonar.projectName=Free Fire Tournament White-Label Platform
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=backend/src,android/core/src/main,android/app-player/src/main,android/app-admin/src/main

# Tests directories (if present)
sonar.tests=backend/tests

# Exclude third-party & generated code
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.gradle/**,**/git demo repo/**,**/*.test.ts,**/*.spec.ts

# Encoding
sonar.sourceEncoding=UTF-8

# TypeScript / JavaScript specifics
sonar.typescript.tsconfigPath=backend/tsconfig.json

# Java/Kotlin binaries (for Android inspection)
sonar.java.binaries=android/core/build/intermediates/javac,android/app-player/build/intermediates/javac
