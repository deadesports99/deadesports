# 🔍 SonarCloud Project Configuration
sonar.host.url=https://sonarcloud.io
sonar.organization=deadesports99
sonar.projectKey=deadesports99_deadesports
sonar.projectName=deadesports
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=backend/src,android/core/src/main,android/app-player/src/main,android/app-admin/src/main

# Exclude third-party, generated and non-shipped code
#  - preview*.html  : bundled design previews (build output, duplicated by definition)
#  - ui-ux demo/**  : design mockups, not part of the shipped apps/backend
#  - tools/**       : local dev helpers (packaging, canva, downloads)
#  - scripts        : E2E/dev harnesses, not deployed
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.gradle/**,**/git demo repo/**,**/*.test.ts,**/*.spec.ts,**/preview*.html,ui-ux demo/**,tools/**,backend/src/scripts/**,backend/src/generated/**,backend/scripts_*.ts

# Encoding
sonar.sourceEncoding=UTF-8

# TypeScript / JavaScript specifics
sonar.typescript.tsconfigPath=backend/tsconfig.json

# Java/Kotlin binaries (for Android inspection)
sonar.java.binaries=android/core/build/intermediates/javac,android/app-player/build/intermediates/javac
