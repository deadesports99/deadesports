      const [theme, setTheme] = useState('dark');
      const [activeTab, setActiveTab] = useState('profile');
      const isDark = theme === 'dark';

      const [provider, setProvider] = useState('google');

      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [isSecurityOpen, setIsSecurityOpen] = useState(false);
      const [isSignOutOpen, setIsSignOutOpen] = useState(false);
      const [activeSettingsSection, setActiveSettingsSection] = useState('rules');

      const [securityPin, setSecurityPin] = useState('4829');
      const [newPassword, setNewPassword] = useState('');
      const [toastMessage, setToastMessage] = useState(null);

      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 2700);
      };

      const handleSaveSecurity = (e) => {
        e.preventDefault();
        if (securityPin.length < 4) {
          triggerToast('Security PIN must be 4 digits.');
          return;
        }
        setIsSecurityOpen(false);
        setNewPassword('');
        triggerToast('Account Security PIN & Password updated!');
      };

      const handleConfirmSignOut = () => {
        setIsSignOutOpen(false);
        triggerToast('Signed out safely. Redirecting to Arena Login...');
      };

      return (
        <div
          id="main-profile-container"
          className={`relative min-h-screen w-full flex items-center justify-center p-3 sm:p-6 transition-colors duration-500 overflow-hidden select-none ${
            isDark ? 'bg-[#081326] text-white' : 'bg-[#DCE4EE] text-slate-900'
          }`}
        >
          {/* Background Mesh */}
          <div className="pointer-events-none fixed inset-0 overflow-hidden">
            <div className={`absolute -top-40 -left-40 h-[500px] w-[500px] rounded-full blur-[130px] transition-opacity duration-700 ${isDark ? 'bg-sky-500/20 opacity-100' : 'bg-sky-400/30 opacity-80'}`} />

              type="button"

                  <span>Light Mode</span>

                  <Moon className="h-3.5 w-3.5 text-sky-600" />
                  <span>Dark Mode</span>

            className={`relative w-full max-w-[430px] rounded-[26px] overflow-hidden transition-all duration-500 ${

                </div>
                <div>

                    <span className="h-1.5 w-1.5 rounded-full bg-emerald-400" />
                  </div>
                  <p className={`text-[10px] font-medium ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>Gamer ID: FF-882910442</p>
                </div>

                  <div className="relative shrink-0">
                    {provider === 'google' ? (
                      <div className="relative h-14 w-14 rounded-2xl overflow-hidden border-2 border-sky-400 shadow-[0_0_15px_rgba(0,194,255,0.35)]">
                        <img
                          src="https://images.unsplash.com/photo-1566492031773-4f4e44671857?auto=format&fit=crop&w=160&q=80"

                        />
                        <span className="absolute bottom-0 right-0 h-4 w-4 rounded-tl-md bg-white flex items-center justify-center p-0.5">
                          <svg className="h-2.5 w-2.5" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.6l3.7 2.9c2.2-2 3.7-5 3.7-8.7z"/>
                            <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5l-3.7 2.8C3.5 19.9 7.4 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.3 14.8c-.2-.8-.4-1.8-.4-2.8s.2-2 .4-2.8L1.6 6.4C.6 8.4 0 10.6 0 12s.6 3.6 1.6 5.6l3.7-2.8z"/>

                        <span className="font-mono text-base font-black text-amber-300">EP</span>
                        <span className="absolute -bottom-1 -right-1 flex h-4 w-4 items-center justify-center rounded-full bg-[#FFD000] text-slate-950">
                          <Phone className="h-2.5 w-2.5" />
                        </span>
                      </div>
                    )}
                  </div>

                  <div className="min-w-0 flex-1 space-y-0.5">
                    <div className="flex items-center gap-1.5">
                      <h2 className={`text-base font-black tracking-tight truncate ${isDark ? 'text-white' : 'text-slate-900'}`}>
                        Erik Padamans
                      </h2>
                      <span className="inline-flex items-center gap-0.5 rounded px-1.5 py-0.2 text-[8px] font-extrabold bg-emerald-400/20 text-emerald-300 border border-emerald-400/40">
                        <CheckCircle2 className="h-2.5 w-2.5 text-emerald-400" />
                        VERIFIED
                      </span>
                    </div>

                    <p className={`text-[11px] font-medium truncate ${isDark ? 'text-slate-300' : 'text-slate-600'}`}>
                      {provider === 'google' ? 'Google: erik.padamans@gmail.co' : 'Phone: +91 99999 00001'}
                    </p>

                    <div className="flex items-center gap-2 pt-0.5">
                      <span className="inline-flex items-center gap-1 text-[10px] font-extrabold text-[#00C2FF]">
                        <Award className="h-2.5 w-2.5" />
                        Grandmaster Tier IV
                      </span>
                    </div>
                  </div>
                </div>

                {/* Account Security & Sign Out Actions */}
                <div className="mt-3.5 grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    onClick={() => setIsSecurityOpen(true)}
                    className={`flex items-center justify-center gap-1.5 rounded-xl py-2 px-2.5 text-xs font-bold transition-all active:scale-[0.96] cursor-pointer border ${
                      isDark ? 'bg-slate-900/80 border-white/10 text-slate-200 hover:border-amber-400/50' : 'bg-white border-slate-300 text-slate-800'
                    }`}
                  >
                    <KeyRound className="h-3.5 w-3.5 text-amber-400" />
                    <span>Security PIN</span>
                  </button>

                  <button
                    type="button"
                    onClick={() => setIsSignOutOpen(true)}
                    className={`flex items-center justify-center gap-1.5 rounded-xl py-2 px-2.5 text-xs font-bold transition-all active:scale-[0.96] cursor-pointer border ${
                      isDark ? 'bg-rose-500/10 border-rose-500/30 text-rose-300 hover:bg-rose-500/20' : 'bg-rose-50 border-rose-200 text-rose-700'
                    }`}
                  >
                    <LogOut className="h-3.5 w-3.5 text-rose-400" />
                    <span>Sign Out</span>
                  </button>
                </div>
              </section>

              {/* ESPORTS CAREER STATS SHOWCASE (THE CORE METRIC GRID) */}
              <section className="space-y-2">
                <div className="flex items-center justify-between">
                  <h3 className={`text-xs font-extrabold uppercase tracking-wider ${isDark ? 'text-slate-200' : 'text-slate-800'}`}>
                    Career Battle Statistics
                  </h3>
                  <span className="text-[10px] font-semibold text-amber-400">
                    Lifetime Ranked Sync
                  </span>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  {/* Stat 1: Matches Played */}
                  <div className={`rounded-2xl p-3 border transition-all ${isDark ? 'bg-[#0B1526]/85 border-white/10' : 'bg-white/90 border-slate-300/85'}`}>
                    <div className="flex items-center justify-between">
                      <span className={`text-[10px] font-bold uppercase tracking-wider ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>
                        Matches Played
                      </span>
                      <Trophy className="h-3.5 w-3.5 text-sky-400" />
                    </div>
                    <p className={`text-xl font-black mt-1 ${isDark ? 'text-white' : 'text-slate-900'}`}>
                      48
                    </p>
                    <p className={`text-[9px] font-medium mt-0.5 ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>
                      Solo 12 • Duo 14 • Squad 22
                    </p>
                  </div>

                  {/* Stat 2: Total Kills */}
                  <div className={`rounded-2xl p-3 border transition-all ${isDark ? 'bg-[#0B1526]/85 border-white/10' : 'bg-white/90 border-slate-300/85'}`}>
                    <div className="flex items-center justify-between">
                      <span className={`text-[10px] font-bold uppercase tracking-wider ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>
                        Total Kills
                      </span>
                      <Crosshair className="h-3.5 w-3.5 text-rose-400" />
                    </div>
                    <p className={`text-xl font-black mt-1 ${isDark ? 'text-white' : 'text-slate-900'}`}>
                      142
                    </p>
                    <p className={`text-[9px] font-medium mt-0.5 text-rose-400`}>
                      2.95 Kill / Death Ratio
                    </p>
                  </div>

                  {/* Stat 3: Booyah Win Rate */}
                  <div className={`rounded-2xl p-3 border transition-all ${isDark ? 'bg-[#0B1526]/85 border-white/10' : 'bg-white/90 border-slate-300/85'}`}>
                    <div className="flex items-center justify-between">
                      <span className={`text-[10px] font-bold uppercase tracking-wider ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>
                        Win Rate
                      </span>
                      <Flame className="h-3.5 w-3.5 text-amber-400" />
                    </div>
                    <p className="text-xl font-black mt-1 text-emerald-400">
                      28%
                    </p>
                    <p className={`text-[9px] font-medium mt-0.5 ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>
                      14 Booyah Victories
                    </p>
                  </div>

                  {/* Stat 4: Total Earnings */}
                  <div className={`rounded-2xl p-3 border transition-all ${isDark ? 'bg-[#0B1526]/85 border-white/10' : 'bg-white/90 border-slate-300/85'}`}>
                    <div className="flex items-center justify-between">
                      <span className={`text-[10px] font-bold uppercase tracking-wider ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>
                        Total Won
                      </span>
                      <Wallet className="h-3.5 w-3.5 text-[#FFD000]" />
                    </div>
                    <p className="text-xl font-black mt-1 text-[#FFD000]">
                      ₹3,450
                    </p>
                    <p className={`text-[9px] font-medium mt-0.5 text-amber-300/80`}>
                      Credited directly to UPI
                    </p>
                  </div>
                </div>
              </section>

              {/* QUICK LINKS SECTION */}
              <section className="space-y-2">
                <div className={`rounded-2xl border divide-y overflow-hidden ${
                  isDark ? 'bg-[#0B1526]/85 border-white/10 divide-white/5' : 'bg-white/90 border-slate-300/85 divide-slate-200'
                }`}>
                  <button
                    type="button"
                    onClick={() => {
                      setActiveSettingsSection('rules');
                      setIsSettingsOpen(true);
                    }}
                    className="w-full flex items-center justify-between p-3 text-left hover:bg-white/5 transition-colors cursor-pointer"
                  >
                    <div className="flex items-center gap-2.5">
                      <FileText className="h-4 w-4 text-sky-400" />
                      <div>
                        <p className={`text-xs font-bold ${isDark ? 'text-white' : 'text-slate-900'}`}>Rules of Fair Play & Anti-Cheat</p>
                        <p className={`text-[10px] ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>Hacking and gun property policies</p>
                      </div>
                    </div>
                    <ChevronRight className="h-3.5 w-3.5 text-slate-500" />
                  </button>

                  <button
                    type="button"
                    onClick={() => {
                      setActiveSettingsSection('about');
                      setIsSettingsOpen(true);
                    }}
                    className="w-full flex items-center justify-between p-3 text-left hover:bg-white/5 transition-colors cursor-pointer"
                  >
                    <div className="flex items-center gap-2.5">
                      <Info className="h-4 w-4 text-amber-400" />
                      <div>
                        <p className={`text-xs font-bold ${isDark ? 'text-white' : 'text-slate-900'}`}>About Free Fire Arena</p>
                        <p className={`text-[10px] ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>v2.4.0 • Verified Organiser System</p>
                      </div>
                    </div>
                    <ChevronRight className="h-3.5 w-3.5 text-slate-500" />
                  </button>
                </div>
              </section>
            </div>

            {/* SETTINGS DRAWER / MODAL */}
            {isSettingsOpen && (
              <div className="absolute inset-0 z-50 bg-black/60 backdrop-blur-md flex flex-col justify-end">
                <div className={`rounded-t-[26px] p-4.5 border-t space-y-4 max-h-[85%] overflow-y-auto ${
                  isDark ? 'bg-slate-900/95 border-white/15 text-white' : 'bg-white border-slate-300 text-slate-900'
                }`}>
                  <div className="flex items-center justify-between border-b pb-3 border-white/10">
                    <div className="flex items-center gap-2">
                      <Settings className="h-4 w-4 text-amber-400" />
                      <h3 className="text-sm font-extrabold uppercase">Platform Settings</h3>
                    </div>
                    <button
                      type="button"
                      onClick={() => setIsSettingsOpen(false)}
                      className="p-1 rounded-lg text-slate-400 hover:text-white cursor-pointer"
                    >
                      <X className="h-4 w-4" />
                    </button>
                  </div>

                  {/* Theme Switcher in Settings */}
                  <div className="flex items-center justify-between p-3 rounded-xl border border-white/10">
                    <div>
                      <p className="text-xs font-bold">Display Theme</p>
                      <p className="text-[10px] text-slate-400">Toggle between Dark Mode (50% glass) and Light Mode</p>
                    </div>
                    <button
                      type="button"
                      onClick={() => setTheme(isDark ? 'light' : 'dark')}
                      className="px-3 py-1 rounded-lg text-xs font-bold bg-[#FFD000] text-slate-950 cursor-pointer"
                    >
                      {isDark ? 'Switch to Light' : 'Switch to Dark'}
                    </button>
                  </div>

                  {/* Anti-Cheat & Rules Notice */}
                  <div className="p-3 rounded-xl border border-white/10 space-y-1">
                    <p className="text-xs font-bold text-sky-400">Rules & Fair Play Guidelines</p>
                    <p className="text-[11px] text-slate-300 leading-relaxed">
                      1. Gun properties are OFF in all official tournament rooms.<br/>
                      2. Emulators & PC players are strictly banned; mobile devices only.<br/>
                      3. Scoreboard screenshot must be submitted within 15 minutes of match completion.
                    </p>
                  </div>

                  <button
                    type="button"
                    onClick={() => {
                      setIsSettingsOpen(false);
                      triggerToast('WhatsApp Organiser Support opened');
                    }}
                    className="w-full py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xs flex items-center justify-center gap-2 cursor-pointer shadow-md"
                  >
                    <MessageSquare className="h-3.5 w-3.5" />
                    <span>Contact Organiser on WhatsApp</span>
                  </button>
                </div>
              </div>
            )}

            {/* SECURITY PIN MODAL */}
            {isSecurityOpen && (
              <div className="absolute inset-0 z-50 bg-black/60 backdrop-blur-md flex items-center justify-center p-4">
                <div className={`w-full max-w-xs rounded-2xl p-4 border space-y-3 ${
                  isDark ? 'bg-slate-900 border-white/15 text-white' : 'bg-white border-slate-300 text-slate-900'
                }`}>
                  <div className="flex items-center justify-between border-b pb-2 border-white/10">
                    <div className="flex items-center gap-2">
                      <KeyRound className="h-4 w-4 text-amber-400" />
                      <h3 className="text-xs font-extrabold uppercase">Account Security PIN</h3>
                    </div>
                    <button type="button" onClick={() => setIsSecurityOpen(false)} className="text-slate-400 hover:text-white cursor-pointer">
                      <X className="h-4 w-4" />
                    </button>
                  </div>

                  <form onSubmit={handleSaveSecurity} className="space-y-3">
                    <div>
                      <label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">
                        4-Digit Security PIN
                      </label>
                      <input
                        type="password"
                        maxLength={4}
                        value={securityPin}
                        onChange={(e) => setSecurityPin(e.target.value.replace(/\D/g, ''))}
                        className="w-full rounded-xl px-3 py-2 text-center text-lg font-mono font-black tracking-widest bg-slate-950 border border-amber-400/50 text-amber-300 outline-none"
                      />
                    </div>

                    <button
                      type="submit"
                      className="w-full py-2 rounded-xl bg-[#FFD000] text-slate-950 font-extrabold text-xs cursor-pointer shadow-md"
                    >
                      Save Security PIN
                    </button>
                  </form>
                </div>
              </div>
            )}

            {/* SIGN OUT CONFIRMATION MODAL */}
            {isSignOutOpen && (
              <div className="absolute inset-0 z-50 bg-black/60 backdrop-blur-md flex items-center justify-center p-4">
                <div className={`w-full max-w-xs rounded-2xl p-4 border space-y-3 text-center ${
                  isDark ? 'bg-slate-900 border-white/15 text-white' : 'bg-white border-slate-300 text-slate-900'
                }`}>
                  <div className="mx-auto flex h-10 w-10 items-center justify-center rounded-full bg-rose-500/20 text-rose-400">
                    <AlertTriangle className="h-5 w-5" />
                  </div>
                  <h3 className="text-sm font-extrabold">Sign Out from Arena?</h3>
                  <p className="text-xs text-slate-400">
                    You will need to verify your phone / email again to join upcoming matches.
                  </p>
                  <div className="grid grid-cols-2 gap-2 pt-1">
                    <button
                      type="button"
                      onClick={() => setIsSignOutOpen(false)}
                      className="py-2 rounded-xl border border-white/10 text-xs font-bold text-slate-300 cursor-pointer"
                    >
                      Cancel
                    </button>
                    <button
                      type="button"
                      onClick={handleConfirmSignOut}
                      className="py-2 rounded-xl bg-rose-500 hover:bg-rose-600 text-white text-xs font-extrabold cursor-pointer"
                    >
                      Yes, Sign Out
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* BOTTOM NAVIGATION BAR (EXACT 3 TABS) */}
            <nav
              aria-label="Bottom Navigation"
              className={`absolute bottom-3 inset-x-4 z-30 rounded-2xl px-2 py-1.5 border transition-all ${
                isDark ? 'bg-slate-950/80 backdrop-blur-xl border-white/15 shadow-2xl shadow-black/80' : 'bg-white/85 backdrop-blur-xl border-slate-900/10 shadow-xl shadow-slate-900/10'
              }`}
            >
              <div className="grid grid-cols-3 gap-1">
                <button
                  type="button"
                  onClick={() => setActiveTab('tournaments')}
                  className={`relative flex items-center justify-center gap-1.5 rounded-xl py-2 px-3 text-[11px] font-bold transition-all active:scale-95 cursor-pointer ${
                    activeTab === 'tournaments' ? 'bg-amber-400/15 text-[#FFD000]' : isDark ? 'text-slate-400 hover:text-slate-200' : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <Gamepad2 className="h-4 w-4" />
                  <span>Tournaments</span>
                </button>

                <button
                  type="button"
                  onClick={() => setActiveTab('wallet')}
                  className={`relative flex items-center justify-center gap-1.5 rounded-xl py-2 px-3 text-[11px] font-bold transition-all active:scale-95 cursor-pointer ${
                    activeTab === 'wallet' ? 'bg-amber-400/15 text-[#FFD000]' : isDark ? 'text-slate-400 hover:text-slate-200' : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <Wallet className="h-4 w-4" />
                  <span>Wallet</span>
                </button>

                <button
                  type="button"
                  onClick={() => setActiveTab('profile')}
                  className={`relative flex items-center justify-center gap-1.5 rounded-xl py-2 px-3 text-[11px] font-bold transition-all active:scale-95 cursor-pointer ${
                    activeTab === 'profile' ? isDark ? 'bg-amber-400/15 text-[#FFD000] border border-amber-400/30 shadow-[0_0_12px_rgba(255,208,0,0.2)]' : 'bg-slate-900 text-[#FFD000]' : isDark ? 'text-slate-400 hover:text-slate-200' : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <User className="h-4 w-4" />
                  <span>Profile</span>
                  {activeTab === 'profile' && (
                    <span className="absolute -bottom-0.5 left-1/2 -translate-x-1/2 h-1 w-5 rounded-full bg-[#FFD000] shadow-[0_0_8px_#FFD000]" />
                  )}
                </button>
              </div>
            </nav>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FreeFireProfileScreen />);
  </script>
</body>
</html>
