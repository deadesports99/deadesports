    function OtpScreen({ theme, identifier, onBack, onVerified }) {
      const isDark = theme === 'dark';
      const [otp, setOtp] = useState(['', '', '', '', '', '']);
      const [timeLeft, setTimeLeft] = useState(60);
      const [error, setError] = useState('');
      const [verifying, setVerifying] = useState(false);
      const refs = useRef([]);

      useEffect(() => {
        if (!timeLeft) return undefined;
        const timer = window.setInterval(() => setTimeLeft((value) => Math.max(0, value - 1)), 1000);
        return () => window.clearInterval(timer);
      }, [timeLeft]);

      const updateDigit = (index, value) => {
        setError('');
        const digits = value.replace(/\D/g, '');
        const next = [...otp];
        if (digits.length > 1) {
          digits.slice(0, 6).split('').forEach((digit, offset) => { if (index + offset < 6) next[index + offset] = digit; });
          setOtp(next);
          refs.current[Math.min(index + digits.length, 5)]?.focus();
          return;
        }
        next[index] = digits;
        setOtp(next);
        if (digits && index < 5) refs.current[index + 1]?.focus();
      };

      const verify = (event) => {
        event.preventDefault();
        if (otp.join('').length !== 6) { setError('Please enter all 6 digits of your verification code.'); return; }
        setVerifying(true);
        window.setTimeout(() => { setVerifying(false); onVerified(); }, 650);
      };

                        isDark ? 'text-white' : 'text-slate-950'

                      Spartan Arena
                    </p>
                  </div>
                </div>

                <div className="mt-5">
                  <h1
                    className={cx(
                      'text-2xl font-black tracking-tight',
                      isDark ? 'text-white' : 'text-slate-950'
                    )}

                    Enter OTP
                  </h1>
                  <p className={cx('mt-1 text-xs font-medium leading-relaxed', isDark ? 'text-slate-400' : 'text-slate-500')}>
                    Enter the 6-digit verification code sent to your mobile number.

                <div className="mt-4">
                  <div

                      'flex items-center justify-between gap-2 rounded-xl border px-3.5 py-2.5',

                      )}
                    >
                      <Pencil className="h-3 w-3" /> Change
                    </button>
                  </div>
                </div>

                <form onSubmit={verify} className="mt-5 space-y-4">

                    <div className="mb-2.5 flex items-center justify-between">
                      <label
                        htmlFor="otp-0"
                        className={cx('text-xs font-bold', isDark ? 'text-slate-200' : 'text-slate-800')}
                      >
                        6-Digit Code
                      </label>
                      <button
                        type="button"
                        onClick={() => {
                          setOtp(['4', '8', '2', '9', '1', '6']);
                          setError('');
                          refs.current[5]?.focus();
                        }}
                        className={cx(

                    <div className="flex justify-between gap-1.5 sm:gap-2">
                      {otp.map((digit, index) => (
                        <input
                          key={index}
                          id={`otp-${index}`}
                          ref={(element) => {
                            refs.current[index] = element;
                          }}
                          value={digit}
                          maxLength={6}
                          inputMode="numeric"
                          aria-label={`Digit ${index + 1} of 6`}
                          onChange={(event) => updateDigit(index, event.target.value)}
                          onKeyDown={(event) => {
                            if (event.key === 'Backspace' && !otp[index] && index > 0) {
                              const next = [...otp];
                              next[index - 1] = '';
                              setOtp(next);
                              refs.current[index - 1]?.focus();
                            }
                            if (event.key === 'ArrowLeft' && index > 0) refs.current[index - 1]?.focus();
                            if (event.key === 'ArrowRight' && index < 5) refs.current[index + 1]?.focus();
                          }}
                          className={cx(
                            'h-13 w-11 rounded-xl border text-center text-xl font-black outline-none transition-all sm:h-14 sm:w-12',
                            digit
                              ? isDark
                                ? 'border-white bg-[#101826] text-white shadow-[0_0_12px_rgba(255,255,255,0.2)] ring-1 ring-white/40'
                                : 'border-black bg-white text-black shadow-sm ring-1 ring-black/20'
                              : isDark
                              ? 'border-white/15 bg-[#060B14] text-white focus:border-white focus:ring-1 focus:ring-white/30'
                              : 'border-slate-300 bg-slate-50 text-slate-900 focus:border-black focus:bg-white focus:ring-1 focus:ring-black/20'
                          )}
                        />
                      ))}
                    </div>

                    {error && (
                      <p className="mt-2.5 flex items-center gap-1.5 text-xs font-semibold text-rose-500">
                        <AlertTriangle className="h-3.5 w-3.5" />

                    )}
                  </div>

                  <div
                    className={cx(
                      'flex items-center justify-between rounded-xl border px-3.5 py-2.5 text-xs',

                      )}

                    {timeLeft ? (
                      <button

                  >
                    {verifying ? (
                      <>

                      </>
                    ) : (
                      'Verify OTP & Continue'
                    )}
                  </button>
                </form>

                <div
                  className={cx(
                    'mt-5 flex items-center justify-center gap-1.5 border-t pt-4 text-[10px]',

                  )}
                >
                  <Headphones className="h-3.5 w-3.5 text-slate-400" /> Spartan Tournament Support is online
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

          <div className={cx('max-h-[88%] overflow-y-auto rounded-t-[28px] border-t p-4 shadow-2xl max-w-lg mx-auto w-full', isDark ? 'border-white/15 bg-slate-900/95 text-white' : 'border-slate-300 bg-white/95 text-slate-900')}>
            <div className="mx-auto mb-3 h-1.5 w-12 rounded-full bg-white/20" />
            <div className="mb-4 flex items-start justify-between gap-3">
              <div>
                <span className="text-[10px] font-black uppercase tracking-widest text-sky-400">Quick Join • {match.modeBadge}</span>
                <h2 className="mt-1 text-xl font-black">{match.title}</h2>
                <p className={cx('mt-1 text-xs', isDark ? 'text-slate-400' : 'text-slate-600')}>Review your entry before securing a slot.</p>
              </div>
              <button type="button" onClick={onClose} aria-label="Close quick join" className={cx('rounded-lg p-1.5', isDark ? 'bg-slate-800 text-slate-300' : 'bg-slate-200 text-slate-700')}><X className="h-4 w-4" /></button>
            </div>
            <div className="grid grid-cols-2 gap-2">
              <div className={cx('rounded-xl border p-3', isDark ? 'border-white/10 bg-[#0B1526]' : 'border-slate-200 bg-slate-50')}>
                <span className="text-[10px] font-bold uppercase text-slate-400">Map & Mode</span>
                <p className="mt-1 text-sm font-black"><MapPin className="mr-1 inline h-3.5 w-3.5 text-sky-400" />{match.map}</p>
                <p className="mt-0.5 text-[11px] text-slate-400">{match.modeBadge}</p>
              </div>
              <div className={cx('rounded-xl border p-3', isDark ? 'border-white/10 bg-[#0B1526]' : 'border-slate-200 bg-slate-50')}>
                <span className="text-[10px] font-bold uppercase text-slate-400">Match Time</span>
                <p className="mt-1 text-sm font-black"><Clock3 className="mr-1 inline h-3.5 w-3.5 text-amber-400" />{match.time}</p>
                <p className="mt-0.5 text-[11px] text-slate-400">Room ID 15 min before start</p>
              </div>
            </div>
            <div className={cx('mt-2 grid grid-cols-2 gap-2 rounded-xl border p-3', isDark ? 'border-white/10 bg-[#0B1526]' : 'border-slate-200 bg-slate-50')}>
              <div><span className="text-[10px] font-bold uppercase text-slate-400">Prize Pool</span><p className="mt-1 text-lg font-black text-amber-400">{formatINR(match.prizePool)}</p></div>
              <div className="text-right"><span className="text-[10px] font-bold uppercase text-slate-400">Per Kill</span><p className="mt-1 text-lg font-black text-sky-400">{match.perKill ? formatINR(match.perKill) : 'Win Only'}</p></div>
            </div>
            <div className={cx('mt-4 rounded-xl border p-3', isDark ? 'border-amber-400/20 bg-amber-400/10' : 'border-amber-300 bg-amber-50')}>
              <div className="flex items-center justify-between"><span className="text-xs font-bold">Entry Fee</span><span className="text-base font-black text-amber-400">{formatINR(match.entryFee)}</span></div>
              <div className="mt-2 flex items-center justify-between border-t border-current/10 pt-2"><span className="text-xs font-bold">Your Available Balance</span><span className={cx('text-base font-black', balance >= match.entryFee ? 'text-emerald-400' : 'text-rose-400')}>{formatINR(balance)}</span></div>
              {balance < match.entryFee && <button type="button" onClick={onTopUp} className="mt-2 text-[11px] font-black text-sky-400 hover:text-sky-300">+ Top up wallet to continue</button>}
            </div>
            <button type="button" disabled={joined || balance < match.entryFee} onClick={onJoin} className={cx('mt-4 flex w-full items-center justify-center gap-2 rounded-xl px-4 py-3 text-[13px] font-black shadow-lg transition-all active:scale-[0.96]', joined ? 'bg-emerald-400 text-slate-950' : balance >= match.entryFee ? 'bg-[#FFD000] text-slate-950 shadow-amber-400/25 hover:bg-[#FFDA29]' : 'cursor-not-allowed bg-slate-500/40 text-slate-300')}>
              {joined ? <><CheckCircle2 className="h-4 w-4" /> Slot Already Secured</> : balance >= match.entryFee ? 'Confirm & Join Slot' : 'Add Cash to Join'}
            </button>
            <p className={cx('mt-2 text-center text-[10px]', isDark ? 'text-slate-500' : 'text-slate-500')}>By joining, you agree to the Arena fair-play rules.</p>
          </div>
        </div>
      );
    }

    function SettingsSheet({ theme, onTheme, onClose, onWhatsApp }) {
      const isDark = theme === 'dark';
      return (
        <div className="fixed inset-0 z-50 flex flex-col justify-end bg-black/65 backdrop-blur-sm">
          <div className={cx('max-h-[86%] overflow-y-auto rounded-t-[28px] border-t p-4 shadow-2xl max-w-lg mx-auto w-full', isDark ? 'border-white/15 bg-slate-900/95 text-white' : 'border-slate-300 bg-white/95 text-slate-900')}>
            <div className="mx-auto mb-3 h-1.5 w-12 rounded-full bg-white/20" />
            <div className="flex items-center justify-between border-b border-white/10 pb-3">
              <div className="flex items-center gap-2"><Settings className="h-4 w-4 text-amber-400" /><h2 className="text-sm font-black">Arena Settings & Fair Play</h2></div>
              <button type="button" onClick={onClose} className={cx('rounded-lg p-1.5', isDark ? 'bg-slate-800 text-slate-300' : 'bg-slate-200 text-slate-700')}><X className="h-4 w-4" /></button>
            </div>
            <div className="mt-3.5 space-y-3">
              <div className={cx('flex items-center justify-between rounded-xl border p-3', isDark ? 'border-white/10 bg-[#0B1526]/90' : 'border-slate-300 bg-slate-100')}>
                <div className="flex items-center gap-2.5">{isDark ? <Moon className="h-4 w-4 text-sky-400" /> : <Sun className="h-4 w-4 text-amber-500" />}<div><p className="text-xs font-bold">Theme Preference</p><p className={cx('text-[10px]', isDark ? 'text-slate-400' : 'text-slate-500')}>{isDark ? 'Dark Frosted • 50% glass' : 'Light Frosted • 25% glass'}</p></div></div>
                <div className="inline-flex rounded-lg border border-white/10 bg-slate-950/80 p-0.5 text-[10px] font-bold">
                  <button type="button" onClick={() => onTheme('dark')} className={cx('rounded-md px-2.5 py-1', isDark ? 'bg-[#00C2FF] text-slate-950' : 'text-slate-400')}>Dark</button>
                  <button type="button" onClick={() => onTheme('light')} className={cx('rounded-md px-2.5 py-1', !isDark ? 'bg-[#FFD000] text-slate-950' : 'text-slate-400')}>Light</button>
                </div>
              </div>
              <div className={cx('rounded-xl border p-3', isDark ? 'border-white/10 bg-[#0B1526]/90' : 'border-slate-300 bg-slate-100')}>
                <div className="flex items-start gap-2.5">
                  <ShieldCheck className="mt-0.5 h-4 w-4 shrink-0 text-emerald-400" />
                  <div>
                    <p className="text-xs font-bold">Fair Play Anti-Cheat Guidelines</p>
                    <ul className={cx('mt-2 space-y-1 text-[11px]', isDark ? 'text-slate-300' : 'text-slate-700')}>
                      <li>• Emulators and modded APKs are banned.</li>
                      <li>• Gun props and third-party scripts must stay OFF.</li>
                      <li>• Room ID and password unlock 15 minutes before a match.</li>
                    </ul>
                  </div>
                </div>
              </div>
              <button type="button" onClick={onWhatsApp} className="flex w-full items-center justify-between rounded-xl border border-emerald-400/35 bg-emerald-500/15 p-3 text-left transition-all hover:bg-emerald-500/25">
                <div className="flex items-center gap-2.5">
                  <MessageSquare className="h-4 w-4 text-emerald-400" />
                  <div>
                    <p className="text-xs font-black text-emerald-300">Contact Organiser on WhatsApp</p>
                    <p className="text-[10px] text-emerald-200/80">Direct support for match and payout help</p>
                  </div>
                </div>
                <ChevronRight className="h-4 w-4 text-emerald-300" />
              </button>
            </div>
          </div>
        </div>
      );
    }

    function SecurityModal({ theme, onClose, onSave }) {
      const isDark = theme === 'dark';
      const [pin, setPin] = useState('4829');
      return (
        <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/70 p-4 backdrop-blur-sm">
          <div className={cx('w-full max-w-sm rounded-2xl border p-4 shadow-2xl', isDark ? 'border-white/15 bg-slate-900 text-white' : 'border-slate-300 bg-white text-slate-900')}>
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2"><KeyRound className="h-4 w-4 text-amber-400" /><h3 className="text-xs font-black uppercase tracking-wider">Account Security & 4-Digit PIN</h3></div>
              <button type="button" onClick={onClose} className="rounded-lg p-1 text-slate-400"><X className="h-4 w-4" /></button>
            </div>
            <div className="mt-4 space-y-3">
              <div>
                <label htmlFor="security-pin" className="mb-1 block text-[10px] font-black uppercase tracking-wider text-slate-400">Withdrawal Security PIN</label>
                <input id="security-pin" maxLength={4} value={pin} onChange={(event) => setPin(event.target.value.replace(/\D/g, '').slice(0, 4))} className="w-full rounded-lg border border-amber-400 bg-[#081120] px-3 py-2 text-xs font-mono font-black tracking-widest text-white outline-none" />
              </div>
              <p className="text-[10px] text-slate-400">Use a private 4-digit PIN to protect UPI withdrawals.</p>
              <div className="flex justify-end gap-2 pt-1">
                <button type="button" onClick={onClose} className="rounded-lg px-3 py-1.5 text-xs font-bold text-slate-400">Cancel</button>
                <button type="button" disabled={pin.length !== 4} onClick={onSave} className="rounded-lg bg-[#FFD000] px-3 py-1.5 text-xs font-black text-slate-950 disabled:opacity-50">Save Security Settings</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function SignOutModal({ theme, onClose, onConfirm }) {
      const isDark = theme === 'dark';
      return (
        <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/70 p-4 backdrop-blur-sm">
          <div className={cx('w-full max-w-sm rounded-2xl border p-4 shadow-2xl', isDark ? 'border-white/15 bg-slate-900 text-white' : 'border-slate-300 bg-white text-slate-900')}>
            <div className="flex items-center gap-2.5">
              <div className="flex h-8 w-8 items-center justify-center rounded-lg border border-rose-400/30 bg-rose-500/15 text-rose-400"><AlertTriangle className="h-4 w-4" /></div>
              <div><h3 className="text-xs font-black uppercase tracking-wider">Confirm Sign Out</h3><p className="text-[11px] text-slate-400">Return to the Arena login screen?</p></div>
            </div>
            <div className="flex justify-end gap-2 pt-4">
              <button type="button" onClick={onClose} className="rounded-lg px-3 py-1.5 text-xs font-bold text-slate-400">Stay Logged In</button>
              <button type="button" onClick={onConfirm} className="rounded-lg bg-rose-500 px-3 py-1.5 text-xs font-black text-white">Yes, Sign Out</button>
            </div>
          </div>
        </div>
      );
    }

    function Toast({ toast }) {
      return (
        <div className="fixed inset-x-0 top-14 z-[90] flex justify-center px-4">
          <div className={cx('flex max-w-[390px] items-center gap-2 rounded-full border px-3.5 py-2 text-[11px] font-bold shadow-lg backdrop-blur-md', toast.type === 'error' ? 'border-rose-400/40 bg-rose-950/95 text-rose-200' : 'border-emerald-400/35 bg-slate-950/95 text-emerald-300')}>
            <span className={cx('flex h-4 w-4 items-center justify-center rounded-full', toast.type === 'error' ? 'bg-rose-400/20' : 'bg-emerald-400/20')}>
              {toast.type === 'error' ? <AlertTriangle className="h-3 w-3 text-rose-400" /> : <CheckCircle2 className="h-3 w-3 text-emerald-400" />}
            </span>
            <span>{toast.text}</span>
          </div>
        </div>
      );
    }

    function FreeFireMasterApp() {
      const [step, setStep] = useState('APP');
      const [theme, setTheme] = useState('dark');
      const [user, setUser] = useState({ name: 'Erik Padamans', identifier: 'erik.padamans@gmail.co', provider: 'google' });
      const [identifier, setIdentifier] = useState('erik.padamans@gmail.co');
      const [password, setPassword] = useState('');
      const [provider, setProvider] = useState('google');
      const [activeTab, setActiveTab] = useState('tournaments');
      const [selectedFilter, setSelectedFilter] = useState('All Matches');
      const [matches, setMatches] = useState(INITIAL_MATCHES);
      const [joinedIds, setJoinedIds] = useState([]);
      const [heroJoined, setHeroJoined] = useState(false);
      const [depositCash, setDepositCash] = useState(120);
      const [winningsCash, setWinningsCash] = useState(300);
      const [transactions, setTransactions] = useState(INITIAL_TRANSACTIONS);
      const [walletMode, setWalletMode] = useState('add');
      const [addAmount, setAddAmount] = useState('100');
      const [upiId, setUpiId] = useState('9876543210@paytm');
      const [withdrawAmount, setWithdrawAmount] = useState('150');
      const [txFilter, setTxFilter] = useState('All');
      const [selectedMatch, setSelectedMatch] = useState(null);
      const [settingsOpen, setSettingsOpen] = useState(false);
      const [securityOpen, setSecurityOpen] = useState(false);
      const [signOutOpen, setSignOutOpen] = useState(false);
      const [toast, setToast] = useState(null);
      const [copiedReference, setCopiedReference] = useState(null);

      const balance = depositCash + winningsCash;
      const isDark = theme === 'dark';

      const showToast = (text, type = 'success') => {
        setToast({ text, type });
        window.setTimeout(() => setToast(null), 2800);
      };

      const addTransaction = (transaction) => setTransactions((items) => [transaction, ...items]);

      const handleLogin = (nextProvider) => {
        if (nextProvider) setProvider(nextProvider);
        if (identifier.trim().length < 4) { showToast('Enter a valid email, phone or Free Fire UID.', 'error'); return; }
        setStep('OTP');
      };

      const joinMatch = (match) => {
        if (joinedIds.includes(match.id)) { showToast(`Already registered in ${match.title}`); return; }
        if (balance < match.entryFee) { showToast('Insufficient balance. Top up your wallet to join.', 'error'); return; }
        const fromDeposit = Math.min(depositCash, match.entryFee);
        setDepositCash((value) => value - fromDeposit);
        setWinningsCash((value) => value - (match.entryFee - fromDeposit));
        setJoinedIds((ids) => [...ids, match.id]);
        if (match.id === HERO_MATCH.id) setHeroJoined(true);
        setMatches((items) => items.map((item) => item.id === match.id ? { ...item, filledSlots: Math.min(item.totalSlots, item.filledSlots + 1) } : item));
        addTransaction({ id: `tx-${Date.now()}`, title: `Tournament Entry: ${match.title}`, amount: match.entryFee, isCredit: false, category: 'Entries', badgeText: 'Entry Fee', badgeTone: 'slate', time: 'Just now', reference: `EGA-${Math.floor(1000000 + Math.random() * 9000000)}` });
        setSelectedMatch(null);
        showToast(`Slot confirmed for ${match.title} • -${formatINR(match.entryFee)}`);
      };

      const deposit = () => {
        const amount = Number(addAmount);
        if (!amount || amount < 10) { showToast('Minimum UPI deposit amount is ₹10.', 'error'); return; }
        setDepositCash((value) => value + amount);
        addTransaction({ id: `tx-${Date.now()}`, title: 'UPI Deposit via GPay / PhonePe', amount, isCredit: true, category: 'Deposits', badgeText: 'Deposit', badgeTone: 'cyan', time: 'Just now', reference: `UTR-${Math.floor(100000000000 + Math.random() * 900000000000)}` });
        showToast(`${formatINR(amount)} added to Deposit Cash via UPI!`);
      };

      const withdraw = () => {
        const amount = Number(withdrawAmount);
        if (!upiId.includes('@') || upiId.trim().length < 5) { showToast('Please enter a valid UPI ID.', 'error'); return; }
        if (!amount || amount < 50) { showToast('Minimum UPI withdrawal amount is ₹50.', 'error'); return; }
        if (amount > winningsCash) { showToast(`Amount exceeds withdrawable Winnings Cash (${formatINR(winningsCash)}).`, 'error'); return; }
        setWinningsCash((value) => value - amount);
        addTransaction({ id: `tx-${Date.now()}`, title: `UPI Withdrawal to ${upiId.trim()}`, amount, isCredit: false, category: 'Withdrawals', badgeText: 'Transfer Success', badgeTone: 'emerald', time: 'Just now', reference: `UTR-${Math.floor(100000000000 + Math.random() * 900000000000)}` });
        showToast(`${formatINR(amount)} transferred to ${upiId.trim()}!`);
      };

      const copyReference = (reference) => {
        navigator.clipboard?.writeText(reference);
        setCopiedReference(reference);
        window.setTimeout(() => setCopiedReference(null), 1500);
      };

      const signOut = () => {
        setSignOutOpen(false);
        setStep('LOGIN');
        setPassword('');
        setActiveTab('tournaments');
        setSelectedMatch(null);
        showToast('Signed out safely. Welcome back to the Arena.');
      };

      if (step === 'LOGIN') {
        return (
          <main className={cx('min-h-screen w-full', isDark ? 'bg-[#081326] text-white' : 'bg-[#DCE4EE] text-slate-900')}>
            <LoginScreen theme={theme} onThemeToggle={() => setTheme(isDark ? 'light' : 'dark')} identifier={identifier} setIdentifier={setIdentifier} password={password} setPassword={setPassword} onContinue={handleLogin} />
            {toast && <Toast toast={toast} />}
          </main>
        );
      }

      if (step === 'OTP') {
        return (
          <main className={cx('min-h-screen w-full', isDark ? 'bg-[#081326] text-white' : 'bg-[#DCE4EE] text-slate-900')}>
            <OtpScreen theme={theme} onThemeToggle={() => setTheme(isDark ? 'light' : 'dark')} identifier={identifier} setIdentifier={(value) => { setIdentifier(value); setUser((current) => ({ ...current, identifier: value })); }} onBack={() => setStep('LOGIN')} onVerified={() => { setUser((current) => ({ ...current, identifier })); setStep('APP'); showToast('OTP verified. Welcome to the Arena!'); }} />
            {toast && <Toast toast={toast} />}
          </main>
        );
      }

      return (
        <main className={cx('relative min-h-screen w-full overflow-x-hidden', isDark ? 'bg-[#081326] text-white' : 'bg-[#DCE4EE] text-slate-900')}>
          <Ambient theme={theme} />
          <div className="relative z-10 mx-auto flex min-h-screen w-full max-w-lg flex-col">
            <div className={cx('pointer-events-none fixed inset-x-0 top-0 h-56 z-0', isDark ? 'bg-[radial-gradient(ellipse_at_top_right,rgba(0,194,255,0.22),rgba(15,23,42,0.85)_65%,transparent)]' : 'bg-[radial-gradient(ellipse_at_top_right,rgba(56,189,248,0.25),rgba(241,245,249,0.7)_65%,transparent)]')} />
            <AppHeader
              theme={theme}
              title={activeTab === 'tournaments' ? 'Free Fire Arena' : activeTab === 'wallet' ? 'Arena Wallet' : 'Player Profile'}
              subtitle={activeTab === 'tournaments' ? 'Verified esports organiser' : activeTab === 'wallet' ? 'Instant prize & entry ledger' : 'Season 6 • Verified competitor'}
              balance={balance}
              onAddFunds={() => { setActiveTab('wallet'); setWalletMode('add'); }}
              onNotify={() => showToast('Room ID & password will be shared 15 minutes before a match.')}
              onSettings={activeTab === 'profile' ? () => setSettingsOpen(true) : undefined}
            />
            <div className="relative z-10 flex-1 px-4 pb-28 pt-4">
              {activeTab === 'tournaments' && (
                <TournamentsView
                  theme={theme}
                  matches={matches}
                  joinedIds={joinedIds}
                  onOpenMatch={setSelectedMatch}
                  selectedFilter={selectedFilter}
                  onFilter={setSelectedFilter}
                  onLockedGame={(name) => showToast(`${name} tournaments are launching soon!`)}
                  heroJoined={heroJoined}
                  onHeroJoin={() => setSelectedMatch(HERO_MATCH)}
                />
              )}
              {activeTab === 'wallet' && (
                <WalletView
                  theme={theme}
                  depositCash={depositCash}
                  winningsCash={winningsCash}
                  walletMode={walletMode}
                  setWalletMode={setWalletMode}
                  addAmount={addAmount}
                  setAddAmount={setAddAmount}
                  upiId={upiId}
                  setUpiId={setUpiId}
                  withdrawAmount={withdrawAmount}
                  setWithdrawAmount={setWithdrawAmount}
                  transactions={transactions}
                  txFilter={txFilter}
                  setTxFilter={setTxFilter}
                  onDeposit={deposit}
                  onWithdraw={withdraw}
                  copiedReference={copiedReference}
                  onCopy={copyReference}
                />
              )}
              {activeTab === 'profile' && (
                <ProfileView
                  theme={theme}
                  user={user}
                  provider={provider}
                  setProvider={(nextProvider) => { setProvider(nextProvider); setUser((current) => ({ ...current, provider: nextProvider })); }}
                  joinedCount={joinedIds.length}
                  onOpenSettings={() => setSettingsOpen(true)}
                  onSecurity={() => setSecurityOpen(true)}
                  onSignOut={() => setSignOutOpen(true)}
                />
              )}
            </div>
            <BottomNav theme={theme} activeTab={activeTab} onChange={setActiveTab} />
            {selectedMatch && (
              <MatchSheet
                theme={theme}
                match={selectedMatch}
                balance={balance}
                joined={joinedIds.includes(selectedMatch.id)}
                onClose={() => setSelectedMatch(null)}
                onJoin={() => joinMatch(selectedMatch)}
                onTopUp={() => { setSelectedMatch(null); setActiveTab('wallet'); setWalletMode('add'); }}
              />
            )}
            {settingsOpen && (
              <SettingsSheet
                theme={theme}
                onTheme={setTheme}
                onClose={() => setSettingsOpen(false)}
                onWhatsApp={() => { setSettingsOpen(false); showToast('Organizer WhatsApp helpdesk opened.'); }}
              />
            )}
            {securityOpen && (
              <SecurityModal
                theme={theme}
                onClose={() => setSecurityOpen(false)}
                onSave={() => { setSecurityOpen(false); showToast('Account security settings updated.'); }}
              />
            )}
            {signOutOpen && (
              <SignOutModal
                theme={theme}
                onClose={() => setSignOutOpen(false)}
                onConfirm={signOut}
              />
            )}
            {toast && <Toast toast={toast} />}
          </div>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<FreeFireMasterApp />);
  </script>
</body>
</html>
