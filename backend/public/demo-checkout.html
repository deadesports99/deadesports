<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mock Checkout — Tourney</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d12;
        --card: #141824;
        --line: #232a3a;
        --text: #eef1f8;
        --muted: #98a2b8;
        --brand: #ff4757;
        --ok: #22c55e;
        --bad: #ef4444;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(1200px 600px at 50% -10%, #1b2233 0%, var(--bg) 55%);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: var(--text);
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 28px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--brand);
        border: 1px solid rgba(255, 71, 87, 0.35);
        background: rgba(255, 71, 87, 0.08);
        border-radius: 999px;
        padding: 5px 10px;
      }
      h1 { font-size: 20px; margin: 16px 0 4px; }
      p.sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 0;
        border-top: 1px solid var(--line);
        font-size: 13px;
      }
      .row span:first-child { color: var(--muted); }
      .row span:last-child { text-align: right; word-break: break-all; font-family: ui-monospace, monospace; }
      .actions { display: grid; gap: 10px; margin-top: 22px; }
      button {
        width: 100%;
        border: 0;
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.06s ease, opacity 0.2s ease;
      }
      button:active { transform: scale(0.99); }
      button:disabled { opacity: 0.55; cursor: not-allowed; }
      .pay { background: var(--brand); color: #fff; }
      .fail { background: transparent; color: var(--muted); border: 1px solid var(--line); }
      .status {
        margin-top: 20px;
        font-size: 13px;
        line-height: 1.5;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: #0f1320;
        color: var(--muted);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .status.ok { border-color: rgba(34, 197, 94, 0.4); color: #86efac; }
      .status.bad { border-color: rgba(239, 68, 68, 0.4); color: #fca5a5; }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">Mock gateway</span>
      <h1>Complete your payment</h1>
      <p class="sub">No real money moves. This page only exercises the wallet settlement path.</p>

      <div class="row"><span>Mode</span><span id="mode">mock</span></div>
      <div class="row"><span>Order</span><span id="orderId">—</span></div>
      <div class="row"><span>Amount</span><span id="amount">—</span></div>

      <div class="actions">
        <button class="pay" id="payBtn" type="button">Pay now</button>
        <button class="fail" id="failBtn" type="button">Simulate failure</button>
      </div>

      <div class="status" id="status">Waiting for you to choose an outcome…</div>
    </main>

    <script src="/api/payments/demo/checkout.js" defer></script>
  </body>
</html>
