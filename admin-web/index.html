<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Spartan Arena — Admin Console</title>
    <!-- Admin console must never be indexed or linked publicly. -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#050B14" />
    <meta name="description" content="Private operations console." />

    <link rel="icon" type="image/png" sizes="32x32" href="/assets/logos/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/logos/spartan_app_icon_192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/logos/spartan_app_icon_192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700;900&family=Cinzel:wght@700;900&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * { -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; padding: 0; }
      body { background-color: #050b14; }
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 9999px; }
    </style>
  </head>
  <body class="bg-ink-950 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
